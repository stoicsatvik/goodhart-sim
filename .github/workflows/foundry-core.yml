name: Foundry core contracts

on:
  pull_request:
    paths:
      - "goodhart_sim.py"
      - "test_goodhart_sim.py"
      - ".github/workflows/foundry-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute deterministic scalar contracts
        run: python -m unittest -v test_goodhart_sim.py
